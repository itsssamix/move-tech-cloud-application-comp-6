name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  REGISTRY: container-registry.br-se1.magalu.cloud
  IMAGE_NAME: cloud-application

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          pip install poetry
          poetry install --no-root
      - name: Executar testes
        run: poetry run pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no Container Registry
        run: |
          echo "${{ secrets.MGC_REGISTRY_PASSWORD }}" | docker login https://${{ env.REGISTRY }} \
            -u "${{ secrets.MGC_REGISTRY_USER }}" \
            --password-stdin

      - name: Build e push da imagem
        run: |
          BASE=${{ env.REGISTRY }}/${{ secrets.MGC_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}
          docker build -t $BASE:${{ github.sha }} -t $BASE:latest .
          docker push $BASE:${{ github.sha }}
          docker push $BASE:latest

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.MGC_SSH_PRIVATE_KEY }}

      - name: Render app manifest with image tag
        run: |
          IMAGE_FULL="${{ env.REGISTRY }}/${{ secrets.MGC_REGISTRY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Replace the whole image line in app.yaml (keeps indentation)
          sed "s|^\(\s*image:\).*|\1 ${IMAGE_FULL}|" k8s/app.yaml > k8s/app-rendered.yaml

      - name: Copy manifests to VM (including rendered app.yaml)
        run: |
          scp -o StrictHostKeyChecking=no k8s/app-rendered.yaml ubuntu@201.23.85.207:~/deploy-manifests/app.yaml
          scp -o StrictHostKeyChecking=no -r k8s/hpa.yaml k8s/servicemonitor.yaml ubuntu@201.23.85.207:~/deploy-manifests/

      - name: Deploy on remote VM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@201.23.85.207 \
            "REGISTRY_USER=${{ secrets.MGC_REGISTRY_USER }} \
             REGISTRY_PASSWORD=${{ secrets.MGC_REGISTRY_PASSWORD }} \
             DATABASE_URL=${{ secrets.DATABASE_URL }} \
             bash -s" <<'EOF'
            set -e
            export KUBECONFIG=$HOME/.kube/config
            cd ~/deploy-manifests
            export REGISTRY=${{ env.REGISTRY }}
            export REGISTRY_NAME=${{ secrets.MGC_REGISTRY_NAME }}
            # Create Docker registry secret
            kubectl create secret docker-registry registry-secret \
              --docker-server=${REGISTRY} \
              --docker-username=${REGISTRY_USER} \
              --docker-password=${REGISTRY_PASSWORD} \
              --dry-run=client -o yaml | kubectl apply -f -
            # Create DB secret
            kubectl create secret generic db-secret \
              --from-literal=url=${DATABASE_URL} \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "Applying rendered app.yaml"
            kubectl apply -f app.yaml
            kubectl apply -f hpa.yaml
            kubectl apply -f servicemonitor.yaml
            kubectl -n default patch svc cloud-application -p '{"spec":{"type":"LoadBalancer"}}'
            kubectl rollout status deployment/cloud-application -n default
          EOF
